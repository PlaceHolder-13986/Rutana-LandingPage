<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Rutana: plan, assign and track your delivery routes in one place.">
  <title>Rutana | Smart route management</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="header" id="header">
    <nav class="nav container" aria-label="Main navigation">
      <a href="#home" class="logo" aria-label="Rutana home">
        <img src="assets/img/logo.svg" alt="" class="logo__img" width="38" height="36">
        <span class="logo__text">Rutana</span>
      </a>

      <button class="nav__toggle" id="navToggle" aria-label="Open menu" aria-expanded="false" aria-controls="navMenu">
        <span></span><span></span><span></span>
      </button>

      <div class="nav__menu" id="navMenu">
        <ul class="nav__list">
          <li><a href="#home" class="nav__link active">Home</a></li>
          <li><a href="#features" class="nav__link">Features</a></li>
          <li><a href="#about" class="nav__link">About us</a></li>
          <li><a href="#team" class="nav__link">Our team</a></li>
          <li><a href="#plans" class="nav__link">Plans</a></li>
          <li><a href="#testimonials" class="nav__link">Testimonials</a></li>
        </ul>
        <a href="#" class="btn btn--primary btn--sm">Log in</a>
      </div>
    </nav>
  </header>

  <main>
    <section class="hero section--dark" id="home">
      <div class="container hero__grid">
        <div class="hero__content">
          <h1 class="hero__title">Welcome to Rutana</h1>
          <p class="hero__text">
            Plan your daily delivery routes, assign vehicles and teams, and keep track of every
            stop and incident from a single platform.
          </p>
          <div class="hero__actions">
            <a href="#plans" class="btn btn--primary">Get started</a>
            <a href="#features" class="btn btn--outline-light">Learn more</a>
          </div>
        </div>

        <div class="hero__media">
          <img src="assets/img/hero.svg" alt="Dispatcher planning delivery routes on the Rutana dashboard" class="hero__img" width="640" height="480">
        </div>
      </div>
    </section>

    <!-- ============================== FEATURES ============================== -->





  </main>
